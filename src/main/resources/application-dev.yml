# ==================== 开发环境配置 ====================

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/oa_system?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: "123456"

mybatis-plus:
  configuration:
    # 下划线字段自动映射为驼峰（user_name -> userName）
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      # 主键自增
      id-type: auto
      # 逻辑删除字段与取值
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

