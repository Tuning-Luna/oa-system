# ==================== 开发环境配置 ====================

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/oa_system?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: "123456"

  # Redis（阶段 4 接入）：本地默认无密码；生产用环境变量覆盖
  data:
    redis:
      host: localhost
      port: 6379
      password:
      timeout: 5s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 0

  # RabbitMQ（阶段 6 接入）：本地默认 guest/guest
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        # 手动 ack：消费成功后确认，失败重投
        acknowledge-mode: auto
        default-requeue-rejected: false

  # 文件上传限制（阶段 7）：单文件 20MB，请求体 21MB
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB

# 文件存储目录（阶段 7）：本地磁盘，项目根目录下 ./uploads
upload:
  dir: ./uploads

mybatis-plus:
  configuration:
    # 下划线字段自动映射为驼峰（user_name -> userName）
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      # 主键自增
      id-type: auto
      # 逻辑删除字段与取值
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
